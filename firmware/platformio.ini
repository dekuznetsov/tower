; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	mobizt/Firebase-ESP-Client @ ^4.4.14
	bblanchon/ArduinoJson      @ ^7.0.4
	https://github.com/emil-e/rapidcheck.git
monitor_speed = 115200

[env:native]
platform = native
test_framework = googletest
lib_deps = 
	google/googletest @ ^1.14.0
	https://github.com/emil-e/rapidcheck.git
; Add rapidcheck extras/gtest include path so <rapidcheck/gtest.h> resolves.
; Add test_support first so fake Arduino.h / Firebase_ESP_Client.h / connectivity.h
; shadow the real SDK headers when firmware source files are compiled on the host.
build_flags =
	-Itest/test_support
	-I.pio/libdeps/native/rapidcheck/include
	-I.pio/libdeps/native/rapidcheck/extras/gtest/include
	-mconsole
	-Wl,--subsystem,console
build_unflags = -Wl,-subsystem,windows
; Exclude all src/ files from the native build — the test files include the
; needed .cpp sources directly to avoid duplicate symbol and linker errors.
build_src_filter = -<*>
